<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: Disables double-tap zoom on iOS and enables safe-area-inset coverage -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Track live stock market breadth and weighted sentiment across your watchlist in real time." />

    <!-- iOS Specific PWA & Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MarketWeight" />
    <meta name="application-name" content="MarketWeight" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA & Apple Touch Icons (Matches awplHelper exactly) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="196x196" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Open Graph (Used by iOS Safari Share Sheet Preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Market Weight Tracker" />
    <meta property="og:description" content="Track live stock market breadth and weighted sentiment across your watchlist in real time." />
    <meta property="og:url" content="https://prakharsinghongit.github.io/MarketWeightTracker/" />
    <meta property="og:image" content="https://prakharsinghongit.github.io/MarketWeightTracker/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://scanner.tradingview.com" />

    <title>Market Weight Tracker</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- Search Modal -->
    <div id="search-modal" class="modal-overlay" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-search-input">
        <div class="modal-search-wrap">
          <svg class="modal-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input
            type="text"
            id="modal-search-input"
            class="modal-search-input"
            placeholder="Search stocks (e.g. Reliance, TCS, AAPL, NVDA)..."
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
          />
          <button id="btn-close-modal" class="modal-close-btn" aria-label="Close modal">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <div id="modal-search-results" class="modal-results"></div>
      </div>
    </div>

    <!-- iOS Install Guide Modal -->
    <div id="ios-install-modal" class="modal-overlay" aria-hidden="true">
      <div class="modal-panel ios-sheet" role="dialog" aria-modal="true">
        <div class="ios-sheet-header">
          <div class="ios-sheet-title">Install on iPhone / iPad</div>
          <button id="btn-close-ios-modal" class="modal-close-btn" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <div class="ios-instructions">
          <div class="ios-step">
            <span class="ios-step-num">1</span>
            <div class="ios-step-txt">
              In Safari, tap the <strong>Share</strong> button
              <svg class="ios-inline-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              in the bottom toolbar.
            </div>
          </div>
          <div class="ios-step">
            <span class="ios-step-num">2</span>
            <div class="ios-step-txt">
              Scroll down and tap <strong>Add to Home Screen</strong>
              <svg class="ios-inline-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><line x1="12" x2="12" y1="8" y2="16"/><line x1="8" x2="16" y1="12" y2="12"/></svg>.
            </div>
          </div>
          <div class="ios-step">
            <span class="ios-step-num">3</span>
            <div class="ios-step-txt">
              Tap <strong>Add</strong> in the top right. MarketWeight will appear as an app icon!
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
